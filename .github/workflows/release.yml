name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}.0.0"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing SIGNING_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/fossdown-release.jks
          echo "SIGNING_STORE_FILE=$GITHUB_WORKSPACE/keystore/fossdown-release.jks" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            "-PversionName=${{ steps.version.outputs.version }}" \
            "-PversionCode=${{ steps.version.outputs.code }}"

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/Fossdown-${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Fossdown ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/Fossdown-${{ steps.version.outputs.version }}.apk
          body: |
            ## Install notes
            This build keeps application id `com.fossdown.prettyprogress` and a stable signing key,
            so it updates your existing Fossdown / Pretty Progress install (and keeps your events).

            Uninstall any leftover empty `com.fossdroid` app if you still have it from the misnamed v1.0.0 build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
